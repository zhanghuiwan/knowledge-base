name: Import DETR article images
on:
  push:
    paths:
      - 'website/articles/detr/index.md'
      - '.github/workflows/import-detr-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original article images
        env:
          DETR_IMAGES: '["9bc44c930d59566fa01cb7ba48e2590d063580f0.png","a10abf5ac6af136beb81e2f00bdea73a89e0cc61.png","2f5ca07abd5f0a469067167910876ad1e1aed455.png","e4fbcc581a969a7b16104c22ff06f645690150f5.png","95651451326eb96fd2f3b01c456b1cec45ea1743.png","edc88b03aaf2dc95930326bb1536ebb8a260959d.png","90d2449056fe95e3ae82491a52a452bc5153d9ed.png","1416be57e40655c4ad0d6e7d0b9acb48d6b2bf85.png","a71fe672e43821ddffb42af1349a5f5261c87bfe.png","f3a5fd6e8ef8ccdfaca6ea2ac031a5cc18016752.png","fe949eaf73c0ea41fdbf5824e2da9a2149a64a1e.png","493ff511768125c4f5359e1f97afc380e7917958.png"]'
        run: |
          python3 - <<'PY'
          import json, os, pathlib, time, urllib.request
          names = json.loads(os.environ["DETR_IMAGES"])
          target = pathlib.Path("website/articles/detr/assets")
          target.mkdir(parents=True, exist_ok=True)
          failures = []
          for name in names:
              dest = target / name
              if dest.exists() and dest.stat().st_size > 1000:
                  print("EXISTS", name, dest.stat().st_size)
                  continue
              for domain in ("i0.hdslb.com","i1.hdslb.com","i2.hdslb.com"):
                  url = f"https://{domain}/bfs/article/{name}"
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36",
                      "Referer": "https://www.bilibili.com/",
                      "Accept": "image/avif,image/webp,image/apng,image/*,*/*;q=0.8"
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=20) as res:
                          data = res.read()
                      if not data.startswith(bytes([137, 80, 78, 71, 13, 10, 26, 10])):
                          raise ValueError(f"Invalid PNG response: {len(data)} bytes, prefix {data[:16]!r}")
                      dest.write_bytes(data)
                      print("DOWNLOADED", name, len(data), url)
                      break
                  except Exception as e:
                      print("RETRY", url, repr(e))
                      time.sleep(1)
              else:
                  failures.append(name)
          if failures:
              raise SystemExit("Unable to download original images: " + ", ".join(failures))
          print("All", len(names), "article images downloaded.")
          PY
      - name: Commit article images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/articles/detr/assets/
          if ! git diff --cached --quiet; then
            git commit -m "保存 DETR 授权转载文章原始配图"
            git push origin HEAD:main
          fi
