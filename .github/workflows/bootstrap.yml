name: 初始化知识库并首次发布

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: knowledge-base-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 恢复项目源码
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-*.b64 | tr -d '\n' | base64 --decode > /tmp/knowledge-base.zip
          echo "bea6409132c0eebba7eca8a183875c07faa5ac01e2bd7f3600016a6d48ad406a  /tmp/knowledge-base.zip" | sha256sum --check
          unzip -q /tmp/knowledge-base.zip -d /tmp/knowledge-base-unpacked
          cp -a /tmp/knowledge-base-unpacked/knowledge-base/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "导入知识库网站源码"
            git push
          fi

      - name: 启用 GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm install

      - name: 构建网站
        run: npm run build

      - name: 上传网站构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4
